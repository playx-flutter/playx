  playx_network: ^2.0.0
  playx_navigation: ^3.0.0
  playx_localization: ^1.0.0
  queen_validators: ^1.0.1
  sentry_flutter: ^10.3.0
  flutter_animate: ^4.5.2
  internet_connection_checker_plus: ^3.1.2
  connectivity_plus: ^7.3.2
  get: 4.7.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

platforms:
  android:
