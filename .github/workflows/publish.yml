name: Publish to pub.dev

on:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Informational only: must not block publishing. Newer Flutter versions
      # deprecate material.dart / cupertino.dart (migration planned).
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos lib test

      - name: Test
        run: flutter test

      - name: Publish
        uses: k-paxian/dart-package-publisher@master
        with:
          credentialJson: ${{ secrets.CREDENTIAL_JSON }}
          flutter: true
          skipTests: true
          environment: pub.dev
