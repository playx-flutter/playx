name: test

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test bin

      # Informational for now: newer Flutter versions deprecate
      # package:flutter/material.dart and cupertino.dart. Migration to
      # material_ui / cupertino_ui is planned for the next version.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos lib test bin example

      - name: Test
        run: flutter test --coverage

      - name: Check test coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          min_coverage: 90

      - name: Publish dry run
        run: dart pub publish --dry-run
